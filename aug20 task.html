<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signal</title>
  <Style>
    .signal{
        width:100px;
        background-color: black;
        padding:15px;
        margin:100px auto;
    }
    .light{
        width:60px;
        height:60px;
        border-radius: 50%;
        margin:10px auto;
    }
    .red{
        background-color: red;
    
    }
    .yellow{
        background-color: yellow;
    }
    .green{
        background-color: green;
    }
  </Style>
</head>
<body>
   
        <div class="signal">
        <div class=" light red"></div>
        <div class=" light yellow"></div>
        <div class=" light green"></div>
        </div>
    
</body>
</html>
